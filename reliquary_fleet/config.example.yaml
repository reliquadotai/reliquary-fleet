# Reliquary fleet dashboard — operator config.
#
# `reliquary-fleet init` copies this template to a private per-user config.
# Edit that file, run `reliquary-fleet doctor`, then start with
# `reliquary-fleet serve`. Source checkouts may still copy it to config.yaml.

# ---------------------------------------------------------------------------
# Validator under test. HTTP provides live window/runtime/final-outcome KPIs.
# Validator SSH is optional and adds the direct container event tail plus
# deployment fingerprint for operators who control that host.
# ---------------------------------------------------------------------------
validator:
  # FastAPI URL exposed by the validator container (default port 8080).
  url: "http://validator.example:8080"
  ssh:
    # Optional. Use either user@host (passwordless key login) or an alias from
    # ~/.ssh/config. Leave blank for the safe HTTP-only client mode.
    host: ""
    port: 22
    # Used only when host is set (and as the default for configured miner
    # boxes that omit their own ssh_key).
    key: "~/.ssh/id_ed25519"
  # Docker container name to tail logs from. Standard reliquary builds
  # name it "reliquary-trainer".
  container: "reliquary-trainer"

# ---------------------------------------------------------------------------
# Non-secret, host-local Code readiness paths. These defaults match the
# source-pinned miner provisioner. Change them only when the grader was
# deliberately installed under a different service/path/metrics port.
# Code reference lanes fail readiness unless the miner and grader units are
# persistently enabled, the root-owned socket has this exact mode, and the
# bundle/canary/source identities match the live validator.
# ---------------------------------------------------------------------------
code_readiness:
  grader_unit: "reliquary-code-grader.service"
  grader_socket: "/tmp/reliquary-grader.sock"
  grader_bundle_link: "/opt/reliquary-code-grader/current"
  grader_metrics_port: 9876
  grader_socket_mode: "0660"

# ---------------------------------------------------------------------------
# Your fleet of miner boxes. The dashboard SSHes into each box on a fast
# loop to fetch GPU stats, journal events, OOM history. The "color" tints
# events from that box in the live tail.
#
#   alias       — ssh alias or user@host
#   hotkey      — SS58 hotkey running on this box (used for event filtering)
#   label       — short tag shown in tables ("stg1", "h100", etc.)
#   color       — cyan | magenta | yellow | green | red | orange | white
#   unit        — systemd unit name (e.g. reliquary-miner-pro@h100a.service)
#                 or null if the miner runs outside systemd
#   miner_kind  — `legacy` (default) or `reliquary_one`. The latter uses the
#                 dedicated redacted adapter and requires `state_root`.
#   state_root  — absolute structured state root for a reliquary_one miner.
#                 Fleet reads only bounded events.jsonl, submissions.json,
#                 active-binding.json, systemctl state, checkpoint tier names,
#                 and nvidia-smi.
#   env_file    — exact service EnvironmentFile path. Set this for the
#                 reference miner because its non-templated service uses
#                 /srv/reliquary-miner-pro/state/miner-pro.env.
#   allowed_units — optional replacement-unit allowlist for one logical box.
#                 Exactly one of `unit` plus these entries may be active. Each
#                 mapping should provide the exact per-lane EnvironmentFile.
#                 To run concurrent shards, configure one fleet row per unit;
#                 rows sharing an SSH host form its exact host-wide allowlist.
#                 Any other active reliquary-miner-pro unit fails closed.
#   telemetry_path — optional standalone miner atomic dashboard JSON. Configure
#                    together with runtime_manifest_path; stale telemetry fails
#                    fleet readiness instead of retaining old counters.
#   runtime_manifest_path — standalone runtime identity manifest (public source
#                           and exact checkpoint only; no wallet material).
#   active_unit_registry_path — optional stable root-owned schema-v1 registry
#                           whose digest-attested active/rollback records replace
#                           checkpoint-specific unit and standalone paths.
#   controller_config_path — optional exact TOML used by this standalone unit.
#                            Fleet verifies the live process argv, then follows
#                            [paths].runtime_manifest and [paths].ledger_db.
#   operator    — public SS58 coldkey/operator identity shown beside hotkey/UID.
#   ssh_key     — optional per-box key override (falls back to validator.ssh.key)
# ---------------------------------------------------------------------------
fleet:
  # Preferred all-in-one Code miner. This adapter never reads wallet files,
  # claimed.json, prepared spool bodies, raw prompts, signatures, proofs,
  # randomness/cooldown bodies, or exception trace contents.
  # - alias: "ops@code-miner.example"
  #   hotkey: "YOUR_SS58_HOTKEY"
  #   label: "code-miner-one"
  #   color: "green"
  #   unit: "reliquary-one.service"
  #   miner_kind: "reliquary_one"
  #   state_root: "/var/lib/reliquary-one/code/state"
  #   telemetry_stale_seconds: 900
  #   ssh_key: null

  - alias: "ops@miner-1.example"
    hotkey: "YOUR_SS58_HOTKEY"
    label: "m1"
    color: "cyan"
    unit: "reliquary-miner-pro@m1.service"
    env_file: "/srv/reliquary-miner-pro/state/miner-pro-m1.env"
    # controller_config_path: "/etc/reliquary-code/mine.toml"
    # telemetry_path: "/var/lib/reliquary-code/dashboard/code.json"
    # runtime_manifest_path: "/var/lib/reliquary-code/runtime-manifest.json"
    # active_unit_registry_path: "/var/lib/reliquary-code/active-unit-registry.json"
    # supervisor_status_path: "/var/lib/reliquary-code/dashboard/profile-supervisor.json"
    # telemetry_stale_seconds: 90
    # Optional display-only, submit-disabled certification process. Fleet
    # reports this as yellow "certifying (non-mining)" only when no allowed
    # canary/mine unit is active and the exact runner hash, argv, artifact
    # paths, manifest/profile/checkpoint paths, and GPU UUID all match. It
    # never supplies alive/mining readiness, attempts, accepts, or rewards.
    # standalone_certification:
    #   runner_path: "/var/lib/reliquary-code/cert/run-certify.sh"
    #   runner_sha256: "64_LOWERCASE_HEX_CHARACTERS"
    #   artifact_dir: "/var/lib/reliquary-code/cert"
    #   runtime_manifest_path: "/var/lib/reliquary-code/runtime-manifest.json"
    #   proof_profile_path: "/var/lib/reliquary-code/cert/proof-profile.json"
    #   checkpoint_path: "/var/lib/reliquary-code/model"
    #   gpu_uuid: "GPU-00000000-0000-0000-0000-000000000000"
    #   # For a generation-only systemd worker, keep it outside unit and
    #   # allowed_units so it remains certification-only and cannot turn the
    #   # fleet row green or contribute attempts/rewards.
    #   service_unit: "reliquary-code-v3-cert-worker.service"
    #   service_user: "reliquary-code-worker"
    #   service_config_path: "/var/lib/reliquary-code/cert/generator.toml"
    #   service_config_sha256: "64_LOWERCASE_HEX_CHARACTERS"
    #   progress_path: "/var/lib/reliquary-code/cert/progress.json"
    # operator: "YOUR_OPERATOR_SS58"
    # One logical H100 row can follow a legacy canary or one named lane:
    # allowed_units:
    #   - unit: "reliquary-miner-pro@math-m2.service"
    #     env_file: "/srv/reliquary-miner-pro/state/miner-pro-math-m2.env"
    #   - unit: "reliquary-miner-pro@code-m2.service"
    #     env_file: "/srv/reliquary-miner-pro/state/miner-pro-code-m2.env"
    #     controller_config_path: "/etc/reliquary-code/canary.toml"
    # Optional exact set allowed to run concurrently. Every named service must
    # already appear in unit + allowed_units; any other multi-service set is
    # still reported as multiple_allowed_units_active.
    # coordinated_units:
    #   - "reliquary-miner-pro@code-m2.service"
    #   - "reliquary-miner-pro@code-m2-peer.service"
    ssh_key: null

# ---------------------------------------------------------------------------
# Submit-disabled accelerator laboratories. These rows are intentionally not
# miners: they have no hotkey, never enter pool/selection/reward accounting,
# and never count toward live fleet readiness. The dashboard verifies the
# process + provisioner submit-disabled attestation and reads only aggregate
# counters from a dedicated evidence database or a checksummed selector
# artifact manifest. Artifact-only completed jobs need no service or database.
# ---------------------------------------------------------------------------
labs:
  # Labs are optional. Uncomment and edit a row only for a deliberately
  # submit-disabled host; never put a production miner under this key.
  # - alias: "ops@offline-gpu.example"
  #   label: "selector-lab"
  #   color: "magenta"
  #   selector_artifact_manifest: "/srv/reliquary-selector/report.json"
  #   source_manifest: "/srv/reliquary-miner-pro/state/source-manifest.env"
  #   ssh_key: null

# ---------------------------------------------------------------------------
# Wallet-free live accelerator components. A component generates for exactly
# one fleet controller and never owns a hotkey, wallet, submit authority, or
# reward funnel. Fleet verifies both services, GPU/power, immutable runtime
# identity and bounded certification progress. Controller attachment is true
# only after its runtime manifest binds the exact component manifest+profile.
# ---------------------------------------------------------------------------
components:
  # - alias: "ops@wallet-free-worker.example"
  #   label: "rtx-code-generation"
  #   color: "magenta"
  #   role: "generation"
  #   controller_label: "m1"
  #   generator_unit: "reliquary-code-rtx-generator.service"
  #   tunnel_unit: "reliquary-code-rtx-live-tunnel.service"
  #   runtime_manifest_path: "/var/lib/reliquary-code/worker/runtime-manifest.unbound.json"
  #   runtime_profile_path: "/var/lib/reliquary-code/generator/runtime-profile.json"
  #   component_config_path: "/etc/reliquary-code-rtx/generator.toml"
  #   evidence_alias: "ops@controller.example"
  #   evidence_dir: "/var/lib/reliquary-code/evidence/rtx/tunnel-measurements"
  #   evidence_runtime_manifest_path: "/var/lib/reliquary-code/evidence/rtx/runtime-manifest.json"
  #   evidence_runtime_profile_path: "/var/lib/reliquary-code/evidence/rtx/generator/runtime-profile.json"
  #   evidence_target_windows: 20
  #   evidence_stale_seconds: 300
  #   telemetry_stale_seconds: 180
  #   ssh_key: null

# ---------------------------------------------------------------------------
# Extra hotkeys to mark as "yours" beyond the fleet above. The fleet
# hotkeys are auto-starred. Use this for hotkeys you watch but don't own
# the GPU box for (e.g. a friend's miner sharing a coldkey, or a renter).
#
# You can also star hotkeys live via the dashboard UI — click the star
# icon in the EMA leaderboard. Star state is persisted to
# the private application state directory.
# ---------------------------------------------------------------------------
starred_hotkeys: []
# Example:
# starred_hotkeys:
#   - "5GEppz..."
#   - "5DAAnrj..."

# ---------------------------------------------------------------------------
# Subnet. Default is netuid 81 (Reliquary mainnet on finney).
# ---------------------------------------------------------------------------
netuid: 81

# ---------------------------------------------------------------------------
# Cloudflare R2 — the dashboard reads validator-published immutable window
# archives to compute slot share / EMA leaderboard / reject summaries.
#
# Prefer a cache-enabled custom domain in public_base_url for distributed
# installs. S3 API requests bypass Cloudflare's edge cache and should remain
# an operator-only fallback with narrowly scoped read credentials.
#
# Environment variables win over YAML:
#   R2_PUBLIC_BASE_URL, R2_ENDPOINT, R2_BUCKET, AWS_ACCESS_KEY_ID,
#   AWS_SECRET_ACCESS_KEY.
# ---------------------------------------------------------------------------
r2:
  # Example: https://archives.example.org
  # Objects must be available below
  # /reliquary/dataset/window-<N>.json.gz with immutable cache headers.
  public_base_url: ""
  endpoint: ""
  bucket: "reliquary"
  access_key_id: ""
  secret_access_key: ""
  # Never scan a shared bucket when /health temporarily lacks its archive
  # index. Operators with a small private bucket may opt in deliberately.
  allow_list_fallback: false
  # Cold history warms progressively instead of opening a large burst.
  fetch_batch_size: 8
  fetch_workers: 2
  refresh_seconds: 60

# ---------------------------------------------------------------------------
# Shared upstream request budgets. These are intentionally independent from
# the fast per-miner SSH refresh. Lower values are rejected by configuration
# validation so one installation cannot accidentally poll a shared validator
# at browser-frame cadence.
# ---------------------------------------------------------------------------
upstream:
  validator_state_seconds: 15
  validator_health_seconds: 30
  validator_verdict_seconds: 60
  max_verdict_hotkeys: 8
  chain_refresh_seconds: 300
  rtt_refresh_seconds: 120
  startup_jitter_seconds: 30

# ---------------------------------------------------------------------------
# Dashboard runtime tuning. Defaults match the previously-shipped fleet.py.
# ---------------------------------------------------------------------------
dashboard:
  # Listen address + port. 127.0.0.1 keeps it local-only (recommended);
  # A non-loopback address additionally requires --allow-remote. Put an
  # authenticated TLS reverse proxy in front; the dashboard has no login.
  host: "127.0.0.1"
  port: 9091
  # Refresh cadence for the fast box-probe loop (SSH journalctl + GPU).
  refresh_seconds: 5
  # Readiness fails when no complete atomic box+validator probe generation has
  # been published for this long. Keep this above the worst-case network probe
  # duration plus refresh_seconds; 60s covers the current bounded ~40s cycle
  # without hiding a genuinely stuck poller.
  health_poll_stale_seconds: 60
  # Number of recent R2 windows to keep cached for the slot-share /
  # EMA / reject panels. 216 windows × ~5 min = ~18 h of history.
  history_windows: 216
