[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reliquary-fleet"
version = "1.1.0"
description = "Private-by-default operations dashboard for Reliquary miner fleets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Reliqua" },
]
keywords = ["bittensor", "dashboard", "miner", "monitoring", "reliquary"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "platformdirs>=4.3,<5",
  "PyYAML>=6,<7",
  "rich>=13.9,<15",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "twine>=6,<8",
]

[project.scripts]
reliquary-fleet = "reliquary_fleet.cli:main"

[project.urls]
Changelog = "https://github.com/reliquadotai/reliquary-fleet/blob/main/CHANGELOG.md"
Documentation = "https://github.com/reliquadotai/reliquary-fleet#readme"
Issues = "https://github.com/reliquadotai/reliquary-fleet/issues"
Source = "https://github.com/reliquadotai/reliquary-fleet"

[tool.setuptools]
py-modules = ["fleet", "fleet_web", "r2_query", "settings", "starred"]

[tool.setuptools.packages.find]
include = ["reliquary_fleet*"]

[tool.setuptools.package-data]
reliquary_fleet = [
  "config.example.yaml",
  "static/*.css",
  "static/*.js",
  "static/brand/*.svg",
  "static/fonts/*",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["fleet.py", "fleet_web.py", "tests/test_current_meta.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
